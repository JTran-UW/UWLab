# Identical to pn_xl_residual_arm6_primdrop.yaml but WITHOUT the appended seg channel
# (append_prim_semantic: false -> model trains on raw xyz, point_dim=3). The seg-vs-no-seg control:
# same XL residual arch, same arm-only proprio, same per-prim robot dropout 0.3, same dataset.
# Per-prim dropout still works (it keys off prim_id, not the seg label).
model: {architecture: residual_point_net, encoder_dims: [1024, 1024, 1024], action_dims: [2048, 2048, 2048, 2048, 2048], predict_std: false}
optim: {lr: 3.0e-4, weight_decay: 1.0e-4, epochs: 50, batch_size: 512}
data:  {num_points: null, val_frac: 0.05, num_workers: 8, no_success_filter: false, seed: 0, joint_pos_dims: 6, append_prim_semantic: false}
aug:   {prim_dropout: {robot: 0.3}, point_dropout: {}}
