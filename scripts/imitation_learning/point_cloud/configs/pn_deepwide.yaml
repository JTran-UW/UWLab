# Deeper per-point encoder (4 layers) with a 512 pooled feature -- tests encoder DEPTH, not just
# pooled width. Balanced head.
model: {architecture: point_net, encoder_dims: [128, 256, 512, 512], action_dims: [1024, 512, 256, 128], predict_std: false}
optim: {lr: 3.0e-4, weight_decay: 1.0e-4, epochs: 50, batch_size: 512}
data:  {num_points: null, val_frac: 0.05, num_workers: 8, no_success_filter: false, seed: 0}
