# Push the pooled global feature to 1024 (4x base). SAME head as pn_widepool512 -> isolates
# the effect of pooled-feature width alone.
model: {architecture: point_net, encoder_dims: [256, 512, 1024], action_dims: [512, 256, 128], predict_std: false}
optim: {lr: 3.0e-4, weight_decay: 1.0e-4, epochs: 50, batch_size: 512}
data:  {num_points: null, val_frac: 0.05, num_workers: 8, no_success_filter: false, seed: 0}
