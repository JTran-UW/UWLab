# Variant of base: max capacity -- wider encoder AND wider/deeper action head,
# trained 1.5x longer (75 epochs) to let the larger model converge.
# Question: what's the ceiling if we stop being parameter-shy?
model:
  encoder_dims: [128, 256, 512]
  action_dims: [1024, 512, 256, 128]
  predict_std: false

optim:
  lr: 3.0e-4
  weight_decay: 1.0e-4
  epochs: 75
  batch_size: 512

data:
  num_points: null
  val_frac: 0.05
  num_workers: 8
  no_success_filter: false
  seed: 0
