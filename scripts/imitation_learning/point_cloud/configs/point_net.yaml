# PointNet (per-point set encoder + max-pool) BC policy. PAIRED with flatten_mlp.yaml for the
# encoder-architecture comparison: IDENTICAL action head + encoder hidden dims and all optim/data
# settings -- the two configs differ ONLY in `architecture` (and thus the encoder: a per-point
# set encoder + max-pool here vs a flat MLP over the concatenated cloud in flatten_mlp).
# Arch = the winning "bighead": base-size point encoder [64,128,256] + big action head.
# point_dim (3 vs 4) and num_points (512 vs 1024) are auto-detected from the dataset.
model:
  architecture: point_net
  encoder_dims: [64, 256, 64]
  action_dims: [1024, 1024, 1024, 256]
  predict_std: false

optim:
  lr: 3.0e-4
  weight_decay: 1.0e-4
  epochs: 50
  batch_size: 512

data:
  num_points: null   # use the full stored cloud (no subsampling)
  val_frac: 0.05
  num_workers: 8
  no_success_filter: false
  seed: 0
